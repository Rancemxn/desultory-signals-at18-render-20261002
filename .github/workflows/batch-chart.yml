name: General chart 1080p60
run-name: ${{ inputs.chart }} general 1080p60
on:
  workflow_dispatch:
    inputs:
      chart:
        required: true
        type: choice
        options: [AboutTheUniverse, TrueHomeTrueWorldRework, Implexrough, EntrancetotheChaos, ExoplanetaryMirage, Hate]
permissions:
  contents: write
concurrency:
  group: sequential-general-charts
  cancel-in-progress: false
jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/runtime
      - env:
          CHART: ${{ inputs.chart }}
          GH_TOKEN: ${{ github.token }}
        run: python -u batch_task.py plan "$CHART"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: planning
          path: |
            output/batch.json
            output/plan/
            output/rules/
            output/assigned*/
            output/base/*.json
            output/base/*.log
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: selected-chart
          path: inputs/selected.zip
          compression-level: 0
          retention-days: 3
  bake:
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        part: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/runtime
      - uses: actions/download-artifact@v4
        with:
          name: planning
          path: output
      - uses: actions/download-artifact@v4
        with:
          name: selected-chart
          path: inputs
      - run: python -u batch_task.py bake ${{ matrix.part }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: baked-${{ matrix.part }}
          path: |
            output/part${{ matrix.part }}/*.json
            output/part${{ matrix.part }}/*.log
            output/part${{ matrix.part }}/handcam.blend
          compression-level: 1
          retention-days: 3
  audit:
    needs: bake
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: baked-*
          path: baked
      - run: python -u parallel_task.py audit baked
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bake-review
          path: output/full/*.json
          retention-days: 7
  render:
    needs: audit
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        part: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/runtime
      - uses: actions/download-artifact@v4
        with:
          name: planning
          path: output
      - uses: actions/download-artifact@v4
        with:
          name: baked-${{ matrix.part }}
          path: output/part${{ matrix.part }}
      - uses: actions/download-artifact@v4
        with:
          name: selected-chart
          path: inputs
      - run: python -u batch_task.py render ${{ matrix.part }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rendered-${{ matrix.part }}
          path: delivery/
          retention-days: 3
  assemble:
    needs: render
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/runtime
      - uses: actions/download-artifact@v4
        with:
          pattern: rendered-*
          merge-multiple: true
          path: assembled
      - uses: actions/download-artifact@v4
        with:
          name: planning
          path: output
      - uses: actions/download-artifact@v4
        with:
          name: bake-review
          path: output/full
      - uses: actions/download-artifact@v4
        with:
          name: selected-chart
          path: inputs
      - run: python -u batch_task.py assemble
      - uses: actions/upload-artifact@v4
        with:
          name: final-delivery
          path: delivery/
          compression-level: 0
          retention-days: 14
      - env:
          GH_TOKEN: ${{ github.token }}
          CHART: ${{ inputs.chart }}
        run: gh release create "general-$CHART-${{ github.run_id }}" delivery/* --title "$CHART — 1080p60" --notes "General chart rules; eight parallel bakes with same-time seam validation; 1920x1080 at 60 FPS. See validation.json for geometry and pose diagnostics."
