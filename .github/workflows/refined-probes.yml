name: Refined numerical pose probes
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        part: [0, 1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/runtime
      - run: |
          mkdir -p output/plan
          gh release download refined-plan-v11 --pattern 'plan.psap' --pattern 'motion-plan.json' --dir output/plan
        env:
          GH_TOKEN: ${{ github.token }}
      - run: python -u refined_task.py probe ${{ matrix.part }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: refined-probe-${{ matrix.part }}
          path: |
            output/probe*/*.json
            output/probe*/*.log
            output/probe*/handcam.blend
          retention-days: 7
