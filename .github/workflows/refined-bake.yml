name: Refined full continuous bake
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bake:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/runtime
      - run: |
          mkdir -p output/plan
          gh release download refined-plan-v8 --pattern 'plan.psap' --pattern 'motion-plan.json' --dir output/plan
        env:
          GH_TOKEN: ${{ github.token }}
      - run: python -u refined_task.py bake
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: refined-full-bake
          path: |
            output/full/*.json
            output/full/*.log
            output/full/handcam.blend
          retention-days: 7
